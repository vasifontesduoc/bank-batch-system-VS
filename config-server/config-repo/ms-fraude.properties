server.port=8092

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=fraude-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.bancoxyz.ms_fraude.event.RetiroEvent

app.kafka.topic.retiros=retiros-topic
app.fraude.umbral=3000

# Resilience4j - proteccion del procesamiento del evento (simula dependencia externa)
resilience4j.circuitbreaker.instances.procesarEvento.sliding-window-size=5
resilience4j.circuitbreaker.instances.procesarEvento.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.procesarEvento.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.procesarEvento.wait-duration-in-open-state=10s
resilience4j.retry.instances.procesarEvento.max-attempts=3
resilience4j.retry.instances.procesarEvento.wait-duration=500ms

