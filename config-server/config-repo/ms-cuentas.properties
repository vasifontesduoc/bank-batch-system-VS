server.port=8090

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka - Productor de eventos de retiro
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
app.kafka.topic.retiros=retiros-topic
spring.kafka.producer.properties.spring.json.add.type.headers=false

# Resilience4j - Retry sobre la publicacion de eventos a Kafka
resilience4j.retry.instances.publicarEvento.max-attempts=3
resilience4j.retry.instances.publicarEvento.wait-duration=500ms
resilience4j.retry.instances.publicarEvento.retry-exceptions=org.apache.kafka.common.errors.TimeoutException,org.springframework.kafka.KafkaException
