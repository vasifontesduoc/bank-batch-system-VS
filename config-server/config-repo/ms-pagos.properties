server.port=8094

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Kafka - Productor de eventos de pago
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
spring.kafka.producer.properties.spring.json.add.type.headers=false
spring.kafka.producer.acks=all
spring.kafka.producer.properties.enable.idempotence=true
app.kafka.topic.pagos=pagos-topic

# Resilience4j - Retry sobre la publicacion de eventos a Kafka
resilience4j.retry.instances.publicarEventoPago.max-attempts=3
resilience4j.retry.instances.publicarEventoPago.wait-duration=500ms
resilience4j.retry.instances.publicarEventoPago.retry-exceptions=org.apache.kafka.common.errors.TimeoutException,org.springframework.kafka.KafkaException

# Resilience4j - proteccion de la llamada a ms-cuentas (retiro)
resilience4j.circuitbreaker.instances.cuentasService.sliding-window-size=5
resilience4j.circuitbreaker.instances.cuentasService.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.cuentasService.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.cuentasService.wait-duration-in-open-state=10s
resilience4j.retry.instances.cuentasService.max-attempts=3
resilience4j.retry.instances.cuentasService.wait-duration=500ms
