server.port=8093

spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.consumer.group-id=notificaciones-group
spring.kafka.consumer.auto-offset-reset=earliest
spring.kafka.consumer.key-deserializer=org.apache.kafka.common.serialization.StringDeserializer
spring.kafka.consumer.value-deserializer=org.springframework.kafka.support.serializer.JsonDeserializer
spring.kafka.consumer.properties.spring.json.trusted.packages=*
spring.kafka.consumer.properties.spring.json.use.type.headers=false
spring.kafka.consumer.properties.spring.json.value.default.type=com.bancoxyz.ms_notificaciones.event.RetiroEvent

app.kafka.topic.retiros=retiros-topic

# Resilience4j - proteccion del envio de notificacion (simula proveedor externo de SMS/email)
resilience4j.circuitbreaker.instances.enviarNotificacion.sliding-window-size=5
resilience4j.circuitbreaker.instances.enviarNotificacion.minimum-number-of-calls=3
resilience4j.circuitbreaker.instances.enviarNotificacion.failure-rate-threshold=50
resilience4j.circuitbreaker.instances.enviarNotificacion.wait-duration-in-open-state=10s
resilience4j.retry.instances.enviarNotificacion.max-attempts=3
resilience4j.retry.instances.enviarNotificacion.wait-duration=500ms

