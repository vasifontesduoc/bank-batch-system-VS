spring.application.name=ms-cuentas

spring.datasource.url=jdbc:mysql://localhost:3306/banco_xyz?useSSL=false&serverTimezone=UTC&allowPublicKeyRetrieval=true
spring.datasource.username=root
spring.datasource.password=password
spring.datasource.driver-class-name=com.mysql.cj.jdbc.Driver

spring.jpa.hibernate.ddl-auto=update
spring.jpa.show-sql=true

# Puerto interno del microservicio. Sin HTTPS: es comunicacion
# servicio-a-servicio en localhost, no expuesta directamente a los clientes
# finales. El requisito de HTTPS del enunciado aplica a la capa que SI habla
# con los clientes externos (los 3 BFF), que corre en el puerto 8443.
server.port=8090

# Kafka - Productor de eventos de retiro
spring.kafka.bootstrap-servers=localhost:9092
spring.kafka.producer.key-serializer=org.apache.kafka.common.serialization.StringSerializer
spring.kafka.producer.value-serializer=org.springframework.kafka.support.serializer.JsonSerializer
app.kafka.topic.retiros=retiros-topic
spring.kafka.producer.properties.spring.json.add.type.headers=false
