spring.application.name=bank-bff-system

# API Keys por canal. Cada cliente debe enviar su key en el header X-API-KEY
# para autenticarse y acceder solo a sus endpoints.
bff.apikey.web=web-2024-xyz-key
bff.apikey.mobile=mobile-2024-xyz-key
bff.apikey.cajero=cajero-2024-xyz-key

# URL del microservicio de datos (ms-cuentas). Unico lugar donde el BFF sabe
# donde vive el microservicio; cambiar de entorno (dev/test/prod) es cambiar
# solo esta propiedad.
ms.cuentas.base-url=http://localhost:8090

# --- HTTPS ---
server.port=8443
server.ssl.enabled=true
server.ssl.key-store=classpath:keystore.p12
server.ssl.key-store-type=PKCS12
server.ssl.key-store-password=bancoxyz123
server.ssl.key-alias=bankxyz
